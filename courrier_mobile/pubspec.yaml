name: courrier
description: "Courrier — application mobile de gestion et de suivi de colis, dérivée du module Colis Autonome de Tibus."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.6.0

  # State management & routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # UI
  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  # Ouverture de liens externes (wa.me pour les notifications WhatsApp colis)
  url_launcher: ^6.3.0
  # Export/partage du manifeste colis (CSV) — voir colis_manifest_screen.dart
  share_plus: ^10.1.2

  # Notifications
  flutter_local_notifications: ^17.2.2
  # FCM — actif dès que `flutterfire configure` a généré firebase_options.dart
  # (voir README section "Notifications push natives (FCM)").
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # Local storage / env
  shared_preferences: ^2.2.3
  flutter_dotenv: ^5.1.0

  # Impression USB / Bluetooth ESC/POS — imprimantes physiques du guichet
  # (Xprinter XP-Q200 en USB, Mini Printer MPT-II en Bluetooth), en plus des
  # ponts P3 natif et WisePrinter desktop existants (printer_service.dart).
  # image_3 = fork maintenu de flutter_pos_printer_platform (discontinued),
  # utilise le package `image_v3` pour ne pas entrer en conflit avec la
  # dépendance `image: ^4.x` d'esc_pos_utils_plus.
  flutter_pos_printer_platform_image_3: ^1.2.4
  esc_pos_utils_plus: ^2.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icons/
