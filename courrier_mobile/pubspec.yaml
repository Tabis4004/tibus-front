name: courrier
description: "Courrier — application mobile de gestion et de suivi de colis, dérivée du module Colis Autonome de Tibus."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  supabase_flutter: ^2.6.0
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  share_plus: ^10.1.2
  flutter_local_notifications: ^17.2.2
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  shared_preferences: ^2.2.3
  flutter_dotenv: ^5.1.0
  connectivity_plus: ^6.0.5
  flutter_pos_printer_platform_image_3: ^1.2.4
  esc_pos_utils_plus: ^2.0.4
  pdf: ^3.12.0
  printing: ^5.14.3
  barcode: ^2.2.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icons/
