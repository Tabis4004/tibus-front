name: courrier_client
description: "Courrier Client — suivi de colis et commande de livraison VTC, pour l'expéditeur/destinataire."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Backend — DEUX projets Supabase distincts, voir core/config/env.dart :
  # 1. Tibus principal (suivi colis, réutilise les RPC Colis Autonome).
  # 2. Tibus Ride (commande/suivi de livraison VTC, projet séparé, comptes
  #    séparés — voir README "Deux backends").
  supabase_flutter: ^2.6.0

  # State management
  flutter_riverpod: ^2.5.1

  # UI
  cupertino_icons: ^1.0.6
  intl: ^0.19.0

  # Local storage / env
  shared_preferences: ^2.2.3
  flutter_dotenv: ^5.1.0

  # Position GPS pour la commande de livraison ("utiliser ma position
  # actuelle" pour le point de départ et d'arrivée — pas de géocodage
  # d'adresse).
  geolocator: ^13.0.1

  # Carte embarquée pour le suivi de livraison (retrait/livraison/position
  # livreur) — mêmes packages que courrier_livreur
  # (core/widgets/delivery_map.dart y est dupliqué à l'identique, pas de
  # package Flutter partagé entre les deux apps) : tuiles OpenStreetMap,
  # aucune clé API requise.
  flutter_map: ^7.0.2
  latlong2: ^0.9.1


  flutter:
    sdk: flutter
  xprinter_sdk: ^0.0.3
  # Dérivation déterministe du mot de passe du compte miroir Tibus Ride
  # (voir RideBackend.ensureMirroredSession) — jamais le vrai mot de passe
  # de l'utilisateur, un hash stable dérivé de son identifiant Tibus.
  crypto: ^3.0.3

  # Appeler le livreur depuis l'écran de suivi (tel:) — voir
  # delivery_status_screen.dart, fiche livreur.
  url_launcher: ^6.3.0

  # Partage natif du lien/code de parrainage — voir rewards_screen.dart
  # (équivalent mobile de navigator.share côté web, rewards.tsx).
  share_plus: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
