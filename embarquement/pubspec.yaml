name: embarquement
description: "Embarquement — scan de billets Tibus et de QR tiers, manifeste et rapport d'embarquement. Module autonome, backend intégré à Tibus 1.0."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  web: ^1.1.1

  supabase_flutter: ^2.6.0
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  shared_preferences: ^2.2.3
  connectivity_plus: ^6.0.5
  share_plus: ^10.1.2
  pdf: ^3.12.0
  printing: ^5.14.3
  barcode: ^2.2.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
