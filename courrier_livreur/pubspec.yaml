name: courrier_livreur
description: "Courrier Livreur — app chauffeur VTC pour les livraisons de colis Tibus, sur le backend Tibus Ride."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Backend — projet Supabase Tibus Ride (bjtklpjdsmqmzhncfflu), séparé de
  # Tibus principal. Voir README "Backend".
  supabase_flutter: ^2.6.0

  # State management
  flutter_riverpod: ^2.5.1

  # UI
  cupertino_icons: ^1.0.6
  intl: ^0.19.0

  # Local storage / env
  shared_preferences: ^2.2.3
  flutter_dotenv: ^5.1.0

  # Position GPS (signalement en ligne + position sur course active)
  geolocator: ^13.0.1

  # Appel/WhatsApp destinataire, navigation Google Maps (lien externe, pas de SDK carte)
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
