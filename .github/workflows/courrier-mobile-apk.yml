name: Build Courrier Mobile APK

# Build de l'APK Android de courrier_mobile dans le cloud (GitHub Actions),
# pour contourner l'absence de SDK Android / JDK 17 en local et le manque
# d'espace disque constaté récemment. Déclenchable manuellement ou sur push
# touchant courrier_mobile/.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'courrier_mobile/**'
      - '.github/workflows/courrier-mobile-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: courrier_mobile

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Préparer .env (placeholder — remplacez par de vraies clés si besoin au runtime)
        run: cp .env.example .env

      - name: flutter pub get
        run: flutter pub get

      - name: Build APK (debug, signé avec la clé debug par défaut)
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: courrier-mobile-debug-apk
          path: courrier_mobile/build/app/outputs/flutter-apk/app-debug.apk
